name: Update GitHub stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch GitHub stats
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          REPO="nehu3n/nooh"
          OUTPUT="apps/web/src/data/github-stats.json"

          repo_response="$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 2 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}")"

          contributors_response="$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 2 \
            -D /tmp/contributors-headers \
            -o /tmp/contributors.json \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/contributors?per_page=1")"

          stars="$(jq '.stargazers_count' <<< "$repo_response")"

          link="$(grep -i '^link:' /tmp/contributors-headers | tr -d '\r' || true)"

          if [[ "$link" =~ page=([0-9]+)\>;\ rel=\"last\" ]]; then
            contributors="${BASH_REMATCH[1]}"
          else
            contributors="$(jq 'length' /tmp/contributors.json)"
          fi

          jq -n \
            --argjson stars "$stars" \
            --argjson contributors "$contributors" \
            --arg updatedAt "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            '{
              stars: $stars,
              contributors: $contributors,
              updatedAt: $updatedAt
            }' > "$OUTPUT"

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add apps/web/src/data/github-stats.json

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "chore(web): update GitHub stats"
          git push